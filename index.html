<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>丼物園 Donburi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="brand-logo">
            <h1>丼物園 Donburi</h1>
        </div>
        <div class="cart-icon" onclick="toggleCart()">
            Cart (<span id="cart-count">0</span>)
        </div>
    </header>

    <main class="menu-container">
        <!-- 簡約底線分類標籤 -->
        <div class="category-tabs">
            <button class="tab-btn active" onclick="filterCategory('all', this)">全部</button>
            <button class="tab-btn" onclick="filterCategory('donburi', this)">丼飯</button>
            <button class="tab-btn" onclick="filterCategory('teishoku', this)">定食</button>
            <button class="tab-btn" onclick="filterCategory('curry', this)">咖哩</button>
            <button class="tab-btn" onclick="filterCategory('risotto', this)">燴飯</button>
        </div>

        <div id="menu-list" class="menu-list"></div>
    </main>

    <!-- 極簡側邊欄 -->
    <div id="cart-sidebar" class="cart-sidebar">
        <div class="sidebar-header">
            <h3>Order Summary</h3>
            <button class="close-btn" onclick="toggleCart()">✕</button>
        </div>
        <ul id="cart-items" class="cart-items-list"></ul>
        <div class="sidebar-footer">
            <div class="total-display">
                <span>Total</span>
                <span>NT$ <span id="cart-total">0</span></span>
            </div>
            <button class="btn-primary" onclick="checkout()">Checkout</button>
        </div>
    </div>

    <!-- 客製化彈出視窗 -->
    <div id="custom-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-item-name">品項名稱</h3>
            <div id="modal-custom-options" style="font-size: 14px; color: #666; margin-bottom: 20px;"></div>
            <div class="modal-actions">
                <button onclick="closeModal()" class="btn-secondary" style="width: 50%;">Cancel</button>
                <button onclick="addToCart()" class="btn-primary" style="width: 50%;">Add</button>
            </div>
        </div>
    </div>

    <!-- 結帳成功畫面 -->
    <div id="checkout-modal" class="modal">
        <div class="modal-content text-center">
            <h3 style="border:none; padding:0; margin-bottom:10px;">Order Confirmed</h3>
            <div class="order-number-title">Pickup Number</div>
            <div class="big-order-number" id="display-order-no">001</div>
            <p class="payment-instruction">請於取餐時出示本畫面並結帳</p>
            <div class="modal-actions mt-20">
                <button onclick="closeCheckoutModal()" class="btn-primary" style="width: 100%;">Done</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
