<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>丼物園 - 現場點餐系統 (櫃檯專用)</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #e9ecef; margin: 0; overflow: hidden; }
        .pos-container { display: flex; gap: 20px; padding: 20px; max-width: 1600px; margin: 0 auto; align-items: flex-start; height: 100vh; box-sizing: border-box; }
        .menu-section { flex: 1; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow-y: auto; height: calc(100vh - 40px); }
        .cart-section { width: 380px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; height: calc(100vh - 40px); }
        #cart-items { overflow-y: auto; flex-grow: 1; list-style: none; padding: 0; margin: 15px 0; border-top: 1px solid #dee2e6; border-bottom: 1px solid #dee2e6; }
        .pos-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f8f9fa; padding-bottom: 15px; }
        .pos-header h2 { margin: 0; color: #007bff; font-size: 24px; }
        .total-area { font-size: 28px; font-weight: bold; text-align: right; color: #ff851b; margin-bottom: 15px; }
        .checkout-btn { background: #28a745; color: white; border: none; padding: 18px; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; box-shadow: 0 4px 6px rgba(40,167,69,0.2); }
        .checkout-btn:hover { background: #218838; transform: translateY(-2px); }
        .main-header, .cart-icon, .cart-sidebar { display: none !important; }
    </style>
</head>
<body>

    <div id="custom-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-item-name">品項名稱</h3>
            <div id="modal-custom-options"></div>
            <div class="modal-actions mt-20">
                <button onclick="closeModal()" class="btn-secondary">取消</button>
                <button onclick="addToCart()" class="btn-primary">加入訂單</button>
            </div>
        </div>
    </div>

    <div class="pos-container">
        <div class="menu-section">
            <div class="pos-header">
                <h2>🖥️ 櫃檯現場點餐 (POS)</h2>
                <div style="font-weight: bold; color: #6c757d;">單號由系統結帳後自動生成</div>
            </div>
            
            <div class="category-tabs">
                <button class="tab-btn active" onclick="filterCategory('all', this)">全部</button>
                <button class="tab-btn" onclick="filterCategory('donburi', this)">🍚 丼飯</button>
                <button class="tab-btn" onclick="filterCategory('teishoku', this)">🍱 定食</button>
                <button class="tab-btn" onclick="filterCategory('curry', this)">🍛 咖哩</button>
                <button class="tab-btn" onclick="filterCategory('risotto', this)">🍲 燴飯</button>
            </div>
            <div id="menu-list" class="menu-list"></div>
        </div>

        <div class="cart-section">
            <h3 style="margin-top:0; color: #343a40;">🛒 目前訂單 (<span id="cart-count">0</span>)</h3>
            <ul id="cart-items"></ul>
            <div class="total-area">總計: $<span id="cart-total">0</span></div>
            <button class="checkout-btn" onclick="submitPosOrder()">結帳並送出廚房</button>
        </div>
    </div>

    <script src="script.js"></script>
    
    <script>
        // 刪除購物車品項
        function removePosCartItem(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        // 更新 POS 購物車介面
        function updateCartUI() {
            const cartList = document.getElementById('cart-items');
            cartList.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price;
                cartList.innerHTML += `
                    <li style="display:flex; justify-content:space-between; align-items:center; padding: 12px 0; border-bottom: 1px dashed #eee;">
                        <span style="font-size: 16px; font-weight: bold; color: #343a40;">${item.name}</span> 
                        <div>
                            <span style="font-weight:bold; margin-right: 15px; color:#FF8C42; font-size: 18px;">$${item.price}</span>
                            <button onclick="removePosCartItem(${index})" style="background:#ff4d4f; color:white; border:none; border-radius:5px; padding:6px 12px; cursor:pointer; font-weight:bold;">刪除</button>
                        </div>
                    </li>`;
            });

            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('cart-total').innerText = total;
        }

        // 送出訂單至後端
       
async function submitPosOrder() {
    if (!cart || cart.length === 0) {
        alert('購物車是空的喔！請先點餐。');
        return;
    }

    try {
        const response = await fetch(
            'https://bento-shop.onrender.com/api/orders',
            {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    studentId: '現場點餐',
                    cart: cart,
                    paymentMethod: 'cash',
                    orderType: 'onsite'
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || '訂單建立失敗');
        }

        // 使用後端產生的每日取餐號碼
        if (!data.pickupNumber) {
            throw new Error(
                '訂單已送出，但伺服器未回傳每日取餐編號。' +
                '請先到店家看板確認訂單，避免重複送單。'
            );
        }

        const queueNumber = data.pickupNumber;

        alert(
            `✅ 結帳成功！請向客人收費。\n` +
            `📣 取餐號碼為：【 ${queueNumber} 】`
        );

        // 清空購物車
        cart = [];
        updateCartUI();

    } catch (error) {
        console.error('POS 訂單錯誤:', error);
        alert(`⚠️ ${error.message}`);
    }
}

    </script>
</body>
</html>
