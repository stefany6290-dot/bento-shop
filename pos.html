<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>丼物園 - 現場點餐系統 (櫃檯專用)</title>
    <!-- 共用前台的樣式表 -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* POS 專屬佈局 (覆蓋部分前台樣式以適應櫃檯大螢幕) */
        body { background-color: #e9ecef; margin: 0; overflow: hidden; }
        .pos-container { display: flex; gap: 20px; padding: 20px; max-width: 1600px; margin: 0 auto; align-items: flex-start; height: 100vh; box-sizing: border-box; }
        
        .menu-section { flex: 1; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow-y: auto; height: calc(100vh - 40px); }
        .cart-section { width: 350px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; height: calc(100vh - 40px); }
        
        #cart-items { overflow-y: auto; flex-grow: 1; list-style: none; padding: 0; margin: 15px 0; border-top: 1px solid #dee2e6; border-bottom: 1px solid #dee2e6; }
        #cart-items li { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed #eee; font-size: 16px; font-weight: bold; color: #343a40; }
        
        .pos-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f8f9fa; padding-bottom: 15px; }
        .pos-header h2 { margin: 0; color: #007bff; font-size: 24px; }
        
        .total-area { font-size: 28px; font-weight: bold; text-align: right; color: #ff851b; margin-bottom: 15px; }
        .checkout-btn { background: #28a745; color: white; border: none; padding: 18px; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; box-shadow: 0 4px 6px rgba(40,167,69,0.2); }
        .checkout-btn:hover { background: #218838; transform: translateY(-2px); }
        
        /* 隱藏前台用不到的元素 (購物車懸浮按鈕、置頂導覽列) */
        .main-header, .cart-icon, .cart-sidebar { display: none !important; }
    </style>
</head>
<body>

    <!-- 共用的客製化彈出視窗 (沿用 script.js 邏輯) -->
    <div id="custom-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-item-name">品項名稱</h3>
            <div id="modal-custom-options"></div>
            <div class="modal-actions mt-20">
                <button onclick="closeModal()" class="btn-secondary">取消</button>
                <button onclick="addToCart()" class="btn-primary">加入訂單</button>
            </div>
        </div>
    </div>

    <div class="pos-container">
        <!-- 左側：菜單區塊 -->
        <div class="menu-section">
            <div class="pos-header">
                <h2>🖥️ 櫃檯現場點餐 (POS)</h2>
                <div style="font-weight: bold; color: #6c757d;">目前單號：<span id="current-queue-display" style="color: #007bff;">現場-001</span></div>
            </div>
            
            <!-- 分頁按鈕區域 -->
            <div class="category-tabs">
                <button class="tab-btn active" onclick="filterCategory('all', this)">全部</button>
                <button class="tab-btn" onclick="filterCategory('donburi', this)">🍚 丼飯</button>
                <button class="tab-btn" onclick="filterCategory('teishoku', this)">🍱 定食</button>
                <button class="tab-btn" onclick="filterCategory('curry', this)">🍛 咖哩</button>
                <button class="tab-btn" onclick="filterCategory('risotto', this)">🍲 燴飯</button>
            </div>

            <!-- 菜單區域 (由 script.js 自動渲染) -->
            <div id="menu-list" class="menu-list"></div>
        </div>

        <!-- 右側：購物籃與結帳區塊 -->
        <div class="cart-section">
            <h3 style="margin-top:0; color: #343a40;">🛒 目前訂單 (<span id="cart-count">0</span>)</h3>
            <ul id="cart-items"></ul>
            <div class="total-area">
                總計: $<span id="cart-total">0</span>
            </div>
            <button class="checkout-btn" onclick="submitPosOrder()">結帳並送出廚房</button>
        </div>
    </div>

    <!-- 載入前台相同的菜單邏輯 -->
    <script src="script.js"></script>
    
    <!-- POS 專屬連線邏輯 -->
    <script>
        let posOrderCounter = 1;

        // 覆寫 updateCartUI 讓它更適合 POS 簡潔顯示
        function updateCartUI() {
            const cartList = document.getElementById('cart-items');
            cartList.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price;
                cartList.innerHTML += `<li><span>${item.name}</span> <span>$${item.price}</span></li>`;
            });

            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('cart-total').innerText = total;
            document.getElementById('current-queue-display').innerText = '現場-' + String(posOrderCounter).padStart(3, '0');
        }

        // 送出現場訂單至後端
        async function submitPosOrder() {
            if (!cart || cart.length === 0) {
                alert("請先選擇餐點！");
                return;
            }

            const queueNumber = '現場-' + String(posOrderCounter).padStart(3, '0');

            try {
                const response = await fetch('https://bento-shop.onrender.com/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        student_id: queueNumber,  // 將取餐號碼存入 student_id 欄位供廚房看版顯示
                        cart_items: JSON.stringify(cart),
                        payment_method: 'cash',
                        order_type: 'onsite'
                    })
                });

                if (response.ok) {
                    alert(`✅ 結帳成功！請向客人收費並告知取餐號碼：【 ${queueNumber} 】\n訂單已同步至廚房看板。`);
                    posOrderCounter++; 
                    cart = []; 
                    updateCartUI(); 
                } else {
                    alert('❌ 送出失敗，狀態碼：' + response.status);
                }
            } catch (error) {
                console.error("錯誤:", error);
                alert("無法連線至伺服器。若為本地測試，將直接清空購物車。");
                posOrderCounter++; 
                cart = []; 
                updateCartUI();
            }
        }
    </script>
</body>
</html>
