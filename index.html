<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>丼物園 - 線上點餐系統</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="brand-logo">
            <h1>🍱 丼物園 線上點餐</h1>
        </div>
        <div class="cart-icon" onclick="toggleCart()">
            🛒 購物車 (<span id="cart-count">0</span>)
        </div>
    </header>

    <main class="menu-container">
        <!-- 分頁按鈕區域 -->
        <div class="category-tabs">
            <button class="tab-btn active" onclick="filterCategory('all', this)">全部餐點</button>
            <button class="tab-btn" onclick="filterCategory('donburi', this)">🍚 丼飯類</button>
            <button class="tab-btn" onclick="filterCategory('teishoku', this)">🍱 定食類</button>
            <button class="tab-btn" onclick="filterCategory('curry', this)">🍛 咖哩類</button>
            <button class="tab-btn" onclick="filterCategory('risotto', this)">🍲 燴飯類</button>
        </div>

        <!-- 菜單區域 -->
        <div id="menu-list" class="menu-list"></div>
    </main>

    <!-- 購物車側欄 -->
    <div id="cart-sidebar" class="cart-sidebar">
        <div class="sidebar-header">
            <h3>🛒 你的購物車</h3>
            <button class="close-btn" onclick="toggleCart()">✕</button>
        </div>
        <ul id="cart-items" class="cart-items-list"></ul>
        <div class="sidebar-footer">
            <p class="total-display"><strong>總金額： $<span id="cart-total">0</span></strong></p>
            <button class="btn-primary full-width" onclick="checkout()">確認送出訂單</button>
        </div>
    </div>

    <!-- 客製化彈出視窗 (Modal) -->
    <div id="custom-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-item-name">品項名稱</h3>
            <div id="modal-custom-options"></div>
            <div class="modal-actions mt-20">
                <button onclick="closeModal()" class="btn-secondary">取消</button>
                <button onclick="addToCart()" class="btn-primary">加入購物車</button>
            </div>
        </div>
    </div>

    <!-- 結帳成功 / 取餐編號提示視窗 -->
    <div id="checkout-modal" class="modal">
        <div class="modal-content text-center">
            <div class="success-badge">🎉 訂單已成功建立！</div>
            <h2 class="order-number-title">您的取餐編號</h2>
            <div class="big-order-number" id="display-order-no">NO. 1</div>
            <p class="payment-instruction">⚠️ <strong>請於取餐時向服務人員出示付款畫面</strong></p>
            <div class="modal-actions mt-20">
                <button onclick="closeCheckoutModal()" class="btn-primary full-width">我知道了</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
